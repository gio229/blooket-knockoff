<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooket Deluxe Labs - Ultimate Animations Edition</title>
    <style>
        @import url('https://googleapis.com');

        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; margin: 0; padding: 0; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        h1, h2, h3, .brand { font-family: 'Fredoka One', cursive; }
        body { display: flex; background: linear-gradient(135deg, #0f001e 0%, #05000d 100%); color: #ffffff; height: 100vh; overflow: hidden; }
        
        /* Navigation Sidebar */
        #sidebar { width: 280px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; padding: 25px; gap: 12px; display: none; }
        #sidebar h2 { text-align: center; color: #ffcc00; font-size: 24px; letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(255, 204, 0, 0.3); }
        .coin-widget { background: linear-gradient(135deg, #ffd700 0%, #ff8800 100%); padding: 15px; border-radius: 16px; text-align: center; font-weight: 900; font-size: 20px; color: #3a0066; box-shadow: 0 6px 20px rgba(255, 136, 0, 0.3); margin-bottom: 15px; }
        .nav-btn { background: rgba(255, 255, 255, 0.04); color: #e0ccff; border: 1px solid rgba(255, 255, 255, 0.03); padding: 14px 20px; border-radius: 14px; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; }
        .nav-btn:hover { background: #7700cc; color: white; transform: translateX(5px); box-shadow: 0 5px 15px rgba(119, 0, 204, 0.4); }
        .nav-btn.active-btn { background: #ff007f; color: white; border-color: #ff007f; box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4); }
        .logout-btn { background: rgba(255, 50, 50, 0.1); border: 1px solid rgba(255, 50, 50, 0.2); color: #ff5555; font-weight: bold; margin-top: auto; }

        /* Window Display Spaces */
        #main-content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        .window { display: none; background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); padding: 35px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); height: 100%; animation: fadeIn 0.4s ease-out; }
        .window.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #250040 0%, #05000d 100%); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        #auth-screen h1 { font-size: 48px; color: #ffcc00; text-shadow: 0 8px 20px rgba(255, 204, 0, 0.4); letter-spacing: 2px; }
        .auth-container { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 12px; width: 340px; }
        
        input, select { padding: 14px 20px; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.06); color: white; font-size: 16px; font-weight: 700; outline: none; text-align: center; width: 100%; }
        input:focus { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); }
        .btn-play { background: linear-gradient(135deg, #ff007f 0%, #7700cc 100%); color: white; border: none; font-weight: 900; font-family: 'Fredoka One', cursive; letter-spacing: 1px; padding: 14px 20px; border-radius: 14px; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4); text-align: center; }
        .btn-play:hover { transform: scale(1.05); }

        /* Market Cards */
        .card-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 25px; padding-bottom: 20px; }
        .pack-card { background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; border-radius: 20px; text-align: center; width: 220px; cursor: pointer; }
        .pack-card:hover { transform: translateY(-8px); border-color: #ffcc00; box-shadow: 0 10px 20px rgba(255,204,0,0.15); }
        
        /* Blook Bouncing Cards */
        .blook-card { background: rgba(255, 255, 255, 0.04); border: 2px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 18px; text-align: center; width: 150px; font-weight: 900; font-size: 18px; animation: float 3s ease-in-out infinite; }
        .blook-avatar { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.3)); animation: subtleBounce 2s ease-in-out infinite alternate; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes subtleBounce {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* Premium Rarity Badges */
        .rarity { font-size: 11px; text-transform: uppercase; font-weight: 900; padding: 3px 8px; border-radius: 6px; margin-top: 5px; display: inline-block; }
        .common { background: #5e5e5e; color: white; }
        .rare { background: #00bcff; color: white; }
        .epic { background: #a020f0; color: white; }
        .legendary { background: #ffaa00; color: white; box-shadow: 0 0 10px rgba(255,170,0,0.4); }
        .chroma { background: linear-gradient(90deg, #ff007f, #7700cc, #00bcff); color: white; animation: rainbow 2s infinite linear; box-shadow: 0 0 15px rgba(255,0,127,0.5); }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        /* CINEMATIC UNBOXING SCREEN OVERLAY */
        #unbox-overlay { position: fixed; inset: 0; background: rgba(10, 0, 20, 0.95); z-index: 500; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
        
        .animated-pack { width: 180px; height: 240px; background: linear-gradient(135deg, #7700cc 0%, #3a0066 100%); border-radius: 16px; border: 4px solid #ffcc00; display: flex; justify-content: center; align-items: center; font-size: 80px; box-shadow: 0 20px 50px rgba(119,0,204,0.5); position: relative; cursor: pointer; }
        
        /* Box Opening Shake and Burst Animations */
        .shake-animation { animation: packShake 0.5s linear infinite; }
        @keyframes packShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-8deg) scale(1.05); }
            40% { transform: rotate(6deg) scale(1.05); }
            60% { transform: rotate(-6deg) scale(1.05); }
            80% { transform: rotate(8deg) scale(1.05); }
        }

        .burst-animation { animation: packBurst 0.4s ease-out forwards; }
        @keyframes packBurst {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.4); opacity: 0.8; filter: brightness(3); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Final Unboxed Reward Card Reveal Card */
        #reward-display-card { width: 220px; height: 300px; background: rgba(255, 255, 255, 0.05); border: 4px solid white; border-radius: 24px; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 15px; text-align: center; animation: rewardReveal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
        @keyframes rewardReveal {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        #reward-emoji { font-size: 90px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
        #reward-name { font-size: 24px; font-weight: 900; color: white; }

        /* Active Chat & Logs Layout */
        #chat-box { height: 65%; border: 1px solid rgba(255,255,255,0.08); overflow-y: auto; padding: 20px; margin-bottom: 15px; border-radius: 16px; background: rgba(0, 0, 0, 0.2); }
        .chat-line { margin-bottom: 10px; font-size: 15px; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 10px; width: fit-content; }
        .tag-admin { color: #ff0055; font-weight: 900; text-shadow: 0 0 8px rgba(255,0,85,0.5); }
        .tag-mod { color: #00bfff; font-weight: 900; }
        #admin-panel { border: 2px dashed #ff0055; background: rgba(255, 0, 85, 0.05); margin-top: 30px; padding: 20px; border-radius: 18px; display: none; }
    </style>
</head>
<body>

    <!-- Cinematic Overlay Screen Module for Pack Openings -->
    <div id="unbox-overlay">
        <div id="animated-pack-wrapper" class="animated-pack" onclick="triggerBurstSequence()">🎁</div>
        <div id="reward-display-card">
            <div id="reward-emoji">🔮</div>
            <div id="reward-name">Blook Item</div>
            <div><span id="reward-badge" class="rarity common">Common</span></div>
            <button class="btn-play" style="margin-top: 15px; padding: 10px 20px; font-size:14px;" onclick="closeUnboxOverlay()">COLLECT</button>
        </div>
    </div>

    <!-- Working Authenticator Gateway Interface -->
    <div id="auth-screen">
        <h1>BLOOK LABS V5</h1>
        <div class="auth-container">
            <input type="text" id="username-in" placeholder="Username...">
            <input type="password" id="password-in" placeholder="Password...">
            <button class="btn-play" onclick="handleAuth('login')">Log In</button>
            <button class="btn-play" onclick="handleAuth('signup')" style="background: #00cc66;">Create Free Account</button>
        </div>
    </div>

    <!-- Navigation Bar Panels -->
    <div id="sidebar">
        <h2 id="user-display">GIO 👑</h2>
        <div class="coin-widget">🪙 <span id="coin-count">0</span></div>
        <button class="nav-btn active-btn" id="btn-market" onclick="setView('market')">🛒 Market Packs</button>
        <button class="nav-btn" id="btn-blooks" onclick="setView('blooks')">🎒 My Collection</button>
        <button class="nav-btn" id="btn-wheel" onclick="setView('wheel')">🎡 Reward Wheel</button>
        <button class="nav-btn" id="btn-chat" onclick="setView('chat')">💬 Lobby Chat</button>
        <button class="nav-btn logout-btn" onclick="logoutAccount()">🚪 Log Out</button>
    </div>

    <!-- Container Content Windows -->
    <div id="main-content">
        <!-- Shop Panel Workspace -->
        <div id="market" class="window active">
            <h1 style="color: #ffcc00; font-size: 32px;">Blook Market</h1>
            <p style="color: #b399ff; margin-bottom: 20px;">Open premium animation boxes instantly</p>
            <div class="card-grid" id="packs-container"></div>
        </div>

        <!-- Inventory List -->
        <div id="blooks" class="window">
            <h1 style="color: #ff007f; font-size: 32px; margin-bottom: 20px;">My Blooks</h1>
            <div class="card-grid" id="blooks-container"></div>
        </div>

        <!-- Bonus System -->
        <div id="wheel" class="window" style="text-align: center;">
            <h1 style="color: #00bcff; font-size: 32px;">Hourly Cash Wheel</h1>
            <div style="font-size: 100px; margin: 30px 0; animation: subtleBounce 2s ease-in-out infinite alternate;">🎡</div>
            <button class="btn-play" onclick="spinWheel()" style="padding: 15px 40px; font-size: 20px;">SPIN THE WHEEL</button>
        </div>

        <!-- Messaging Panels -->
        <div id="chat" class="window">
            <h1 style="color: #00cc66; font-size: 32px; margin-bottom: 5px;">Lobby Chat</h1>
            <div id="chat-box"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-msg" style="width:75%;" placeholder="Say hello to the workspace screen logs...">
                <button class="btn-play" onclick="sendChat()">Send</button>
            </div>
        </div>

        <!-- Secret System Console Managed Exclusively by Admins -->
        <div id="admin-panel">
            <h2 style="color:#ff0055; margin-bottom: 15px;">👑 Admin Power Console Panel</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                <input type="text" id="adm-target-user" placeholder="Target Username" style="width: 220px;">
                <select id="adm-role-select" style="width: 180px;">
                    <option value="admin">Give Admin Rank</option>
                    <option value="mod">Give Moderator Rank</option>
                    <option value="user">Demote Player</option>
                </select>
                <button class="btn-play" onclick="modifyRole()" style="background: #ff0055;">Apply Update</button>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="adm-blook" placeholder="Gift Blook Item Name" style="width: 220px;">
                <input type="number" id="adm-coins" placeholder="Tokens Count" style="width: 180px;">
                <button class="btn-play" onclick="runAdminInjection()" style="background: #333;">Inject Items / Coins</button>
            </div>
        </div>
    </div>

    <script>
        const BLOOK_DETAILS = {
            'Knight': { emoji: '⚔️', rarity: 'common' }, 'Queen': { emoji: '👸', rarity: 'rare' },
            'King': { emoji: '👑', rarity: 'rare' }, 'Wizard': { emoji: '🧙', rarity: 'epic' },
            'Dragon': { emoji: '🐉', rarity: 'legendary' }, 'Meteor': { emoji: '☄️', rarity: 'common' },
            'Astronaut': { emoji: '👨‍🚀', rarity: 'rare' }, 'Alien': { emoji: '👽', rarity: 'rare' },
            'UFO': { emoji: '🛸', rarity: 'epic' }, 'Star': { emoji: '⭐', rarity: 'legendary' },
            'Ninja': { emoji: '🥷', rarity: 'common' }, 'Samurai': { emoji: '👺', rarity: 'rare' },
            'Mech Robot': { emoji: '🤖', rarity: 'epic' }, 'Titan Creature': { emoji: '👹', rarity: 'legendary' },
            'Rainbow Slime': { emoji: '🌈', rarity: 'chroma' }, 'Neon Cat': { emoji: '🐱', rarity: 'chroma' }
        };

        const PACKS = {
            Medieval: { cost: 20, emoji: '🛡️', blooks: ['Knight', 'King', 'Queen', 'Wizard', 'Dragon'] },
            Space: { cost: 35, emoji: '🚀', blooks: ['Meteor', 'Astronaut', 'Alien', 'UFO', 'Star'] },
            Anime: { cost: 50, emoji: '⛩️', blooks: ['Ninja', 'Samurai', 'Mech Robot', 'Titan Creature'] },
            Chroma: { cost: 150, emoji: '✨', blooks: ['Rainbow Slime', 'Neon Cat'] }
        };

        let currentUser = null;
        let selectedPackToOpen = null;

        function handleAuth(type) {
            const username = document.getElementById('username-in').value.trim();
            const password = document.getElementById('password-in').value.trim();
            if (!username || !password) return alert("Please type your username and password!");

            const database = JSON.parse(localStorage.getItem('blook_account_db') || "{}");

            if (type === 'signup') {
                if (database[username.toLowerCase()]) return alert("This username is already taken!");
                database[username.toLowerCase()] = {
                    username: username, password: password, coins: 200, blooks: [], lastWheel: 0,
                    rank: (username.toLowerCase() === 'gio') ? 'admin' : 'user'
                };
                localStorage.setItem('blook_account_db', JSON.stringify(database));
                alert("Account created! Click Log In to enter.");
                return;
            }

            if (type === 'login') {
                const userRecord = database[username.toLowerCase()];
                if (!userRecord || userRecord.password !== password) return alert("Wrong username or password!");
                currentUser = userRecord;
                launchDashboard();
            }
        }

        function launchDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('main-content').style.display = 'block';
            checkAdminVisibility();
            updateUI();
            renderPacks();
        }

        function checkAdminVisibility() {
            if (currentUser.rank === 'admin' || currentUser.rank === 'mod') {
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                document.getElementById('admin-panel').style.display = 'none';
            }
        }

        function saveUserData() {
            const database = JSON.parse(localStorage.getItem('blook_account_db') || "{}");
            database[currentUser.username.toLowerCase()] = currentUser;
            localStorage.setItem('blook_account_db', JSON.stringify(database));
        }

        function logoutAccount() {
            currentUser = null;
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function modifyRole() {
            const targetName = document.getElementById('adm-target-user').value.trim().toLowerCase();
            const selectedRole = document.getElementById('adm-role-select').value;
            const database = JSON.parse(localStorage.getItem('blook_account_db') || "{}");

            if (!database[targetName]) return alert("Target player username not found!");
            database[targetName].rank = selectedRole;
            localStorage.setItem('blook_account_db', JSON.stringify(database));
            alert(`Updated ${database[targetName].username}'s permissions to: ${selectedRole}`);
            
            if (currentUser.username.toLowerCase() === targetName) {
                currentUser.rank = selectedRole;
                checkAdminVisibility();
                updateUI();
            }
        }

        function updateUI() {
            let rankTag = '';
            if(currentUser.rank === 'admin') rankTag = ' <span class="tag-admin">[👑 ADMIN]</span>';
            if(currentUser.rank === 'mod') rankTag = ' <span class="tag-mod">[⭐ MOD]</span>';

            document.getElementById('user-display').innerHTML = currentUser.username + rankTag;
            document.getElementById('coin-count').innerText = currentUser.coins;
            
            const inv = document.getElementById('blooks-container');
            inv.innerHTML = '';
            
            currentUser.blooks.forEach(b => {
                const item = BLOOK_DETAILS[b] || { emoji: '📦', rarity: 'common' };
                inv.innerHTML += `
                    <div class="blook-card">
                        <div class="blook-avatar">${item.emoji}</div>
                        <div style="font-size:14px;">${b}</div>
                        <span class="rarity ${item.rarity}">${item.rarity}</span>
                    </div>`;
            });
            saveUserData();
        }

        function setView(id) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active-btn');
        }

        function renderPacks() {
            const container = document.getElementById('packs-container');
            container.innerHTML = '';
            for (let name in PACKS) {
                container.innerHTML += `
                    <div class="pack-card" onclick="openPackCinematic('${name}')">
                        <div style="font-size: 50px; margin-bottom: 10px;">${PACKS[name].emoji}</div>
                        <h3 style="font-size: 20px; margin-bottom: 5px;">${name} Pack</h3>
                        <p style="color:#ffd700; font-weight:900;">🪙 ${PACKS[name].cost}</p>
                    </div>`;
            }
        }

        /* DYNAMIC BLOOKET-STYLE ANIMATION ENGINE INTERFACES */
        function openPackCinematic(name) {
            const pack = PACKS[name];
            if (currentUser.coins < pack.cost) return alert('Not enough tokens!');
            
            currentUser.coins -= pack.cost;
            selectedPackToOpen = name;
            updateUI();

            // Setup overlay display fields
            document.getElementById('reward-display-card').style.display = 'none';
            const packWrapper = document.getElementById('animated-pack-wrapper');
            packWrapper.style.display = 'flex';
            packWrapper.className = 'animated-pack shake-animation';
            packWrapper.innerText = pack.emoji;

            document.getElementById('unbox-overlay').style.display = 'flex';
        }

        function triggerBurstSequence() {
            const packWrapper = document.getElementById('animated-pack-wrapper');
            packWrapper.className = 'animated-pack burst-animation';

            setTimeout(() => {
                packWrapper.style.display = 'none';
                
                // Roll reward data engine drops
                const pack = PACKS[selectedPackToOpen];
                const reward = pack.blooks[Math.floor(Math.random() * pack.blooks.length)];
                currentUser.blooks.push(reward);
                updateUI();

                // Hydrate presentation cards configuration tags
                const item = BLOOK_DETAILS[reward] || { emoji: '📦', rarity: 'common' };
                document.getElementById('reward-emoji').innerText = item.emoji;
                document.getElementById('reward-name').innerText = reward;
                
                const badge = document.getElementById('reward-badge');
                badge.innerText = item.rarity;
                badge.className = `rarity ${item.rarity}`;

                // Inject special colored glows based on unboxed tier rarities
                const card = document.getElementById('reward-display-card');
                card.style.display = 'flex';
                if (item.rarity === 'chroma') card.style.borderColor = '#ff007f';
                else if (item.rarity === 'legendary') card.style.borderColor = '#ffaa00';
                else if (item.rarity === 'epic') card.style.borderColor = '#a020f0';
                else card.style.borderColor = 'white';

            }, 400);
        }

        function closeUnboxOverlay() {
            document.getElementById('unbox-overlay').style.display = 'none';
            selectedPackToOpen = null;
        }

        function spinWheel() {
            const now = Date.now();
            if (now - currentUser.lastWheel < 3600000) {
                const remaining = Math.ceil((3600000 - (now - currentUser.lastWheel)) / 60000);
                return alert(`Wheel cooling down! Wait ${remaining} minutes.`);
            }
            const reward = Math.floor(Math.random() * 200) + 100;
            currentUser.coins += reward;
            currentUser.lastWheel = now;
            updateUI();
            alert(`💰 Success! You scored +${reward} tokens!`);
        }

        function sendChat() {
            const inp = document.getElementById('chat-msg');
            if (!inp.value.trim()) return;
            let tagStr = currentUser.username;
            if(currentUser.rank === 'admin') tagStr = `<span class="tag-admin">[👑 ADMIN] ${currentUser.username}</span>`;
            if(currentUser.rank === 'mod') tagStr = `<span class="tag-mod">[⭐ MOD] ${currentUser.username}</span>`;
            
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-line"><b>${tagStr}:</b> ${inp.value.trim()}</div>`;
            box.scrollTop = box.scrollHeight;
            inp.value = '';
        }

        function runAdminInjection() {
            const blookName = document.getElementById('adm-blook').value.trim();
            const coinAmt = document.getElementById('adm-coins').value;
            if (blookName) currentUser.blooks.push(blookName);
            if (coinAmt) currentUser.coins += parseInt(coinAmt);
            updateUI();
            alert("Assets injected!");
        }
    </script>
</body>
</html>
