<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blook Knockoff Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; margin: 0; padding: 0; }
        body { display: flex; background: #f0f0f0; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 250px; background: #3a0066; color: white; display: flex; flex-direction: column; padding: 20px; gap: 15px; display: none; }
        #sidebar h2 { text-align: center; color: #ffcc00; margin-bottom: 20px; }
        .nav-btn { background: #560099; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; font-weight: bold; }
        .nav-btn:hover { background: #7700cc; }
        
        /* App Windows */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; display: none; }
        .window { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 0 #ddd; height: 100%; }
        .active { display: block; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #3a0066; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; color: white; }
        input, button { padding: 12px; border-radius: 8px; border: 2px solid #3a0066; font-size: 16px; }
        .btn-play { background: #ffcc00; color: #3a0066; border: none; font-weight: bold; cursor: pointer; }

        /* Custom Styles */
        .card-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .item-card { background: #f9f9f9; border: 3px solid #3a0066; padding: 15px; border-radius: 12px; text-align: center; width: 140px; font-weight: bold; }
        #chat-box { height: 70%; border: 2px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #fafafa; }
        #admin-panel { border: 4px dashed red; background: #fff0f0; margin-top: 20px; padding: 15px; display: none; }
    </style>
</head>
<body>

    <!-- Auth Splash Screen -->
    <div id="auth-screen">
        <h1>Blooket Knockoff 🎉</h1>
        <input type="text" id="username-in" placeholder="Username...">
        <div>
            <button class="btn-play" onclick="auth('login')">Log In / Sign Up</button>
        </div>
    </div>

    <!-- Navigation Sidebar -->
    <div id="sidebar">
        <h2 id="user-display">GIO 👑</h2>
        <div style="background: #220044; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; color: #ffcc00;">
            🪙 Coins: <span id="coin-count">100</span>
        </div>
        <button class="nav-btn" onclick="setView('market')">🛒 Market Packs</button>
        <button class="nav-btn" onclick="setView('blooks')">🎒 My Blooks</button>
        <button class="nav-btn" onclick="setView('wheel')">🎡 Daily Wheel</button>
        <button class="nav-btn" onclick="setView('chat')">💬 Global Chat</button>
    </div>

    <!-- View Windows -->
    <div id="main-content">
        <!-- Market Window -->
        <div id="market" class="window active">
            <h1>Blook Market</h1>
            <div class="card-grid" id="packs-container"></div>
        </div>

        <!-- Blooks Window -->
        <div id="blooks" class="window">
            <h1>My Collection</h1>
            <div class="card-grid" id="blooks-container"></div>
        </div>

        <!-- Reward Wheel Window -->
        <div id="wheel" class="window">
            <h1>Hourly Coin Wheel</h1>
            <p style="margin: 15px 0;">Spin every hour for free cash updates!</p>
            <button class="btn-play" onclick="spinWheel()" style="padding:20px; font-size:24px;">SPIN WHEEL 🎡</button>
        </div>

        <!-- Chat Window -->
        <div id="chat" class="window">
            <h1>Global Chat Simulation</h1>
            <div id="chat-box"></div>
            <input type="text" id="chat-msg" style="width: 70%;" placeholder="Say something funny...">
            <button class="btn-play" onclick="sendChat()">Send</button>
        </div>

        <!-- Admin Interface -->
        <div id="admin-panel">
            <h2 style="color:red;">👑 Gio's Admin Console</h2>
            <p>Give yourself custom rewards instantly:</p>
            <input type="text" id="adm-blook" placeholder="Blook Name">
            <input type="number" id="adm-coins" placeholder="Coins Amount">
            <button onclick="runAdmin()" style="background:red; color:white; font-weight:bold; cursor:pointer;">Inject Assets</button>
        </div>
    </div>

    <script>
        // Game Data Setup
        const PACKS = {
            Medieval: { cost: 25, blooks: ['King', 'Queen', 'Knight', 'Dragon', 'Wizard'] },
            Space: { cost: 50, blooks: ['Astronaut', 'Alien', 'UFO', 'Meteor', 'Star'] },
            Chroma: { cost: 250, blooks: ['Rainbow Slime', 'Neon Cat', 'Glitch Blob'] }
        };

        let currentUser = {
            username: "",
            coins: 100,
            blooks: [],
            lastWheel: 0,
            isAdmin: false
        };

        // Simulated Global Chat Messages
        const botMessages = [
            "Who wants to trade a Dragon?", "Just pulled a Neon Cat!! OMG", 
            "Gio your game is so fun", "Sub to my channel guys", "Testing out the chat!"
        ];

        function auth(action) {
            const name = document.getElementById('username-in').value.trim();
            if (!name) return alert("Please enter a username!");

            // Check if user already has save data in browser
            const savedData = localStorage.getItem('blook_user_' + name.toLowerCase());
            if (savedData) {
                currentUser = JSON.parse(savedData);
            } else {
                currentUser.username = name;
                currentUser.isAdmin = (name.toLowerCase() === 'gio');
                saveGame();
            }

            // Reveal Game Panels
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('main-content').style.display = 'block';

            if (currentUser.isAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
            }

            updateUI();
            renderPacks();
            startChatBot();
        }

        function saveGame() {
            localStorage.setItem('blook_user_' + currentUser.username.toLowerCase(), JSON.stringify(currentUser));
        }

        function updateUI() {
            document.getElementById('user-display').innerText = currentUser.username + (currentUser.isAdmin ? ' 👑' : '');
            document.getElementById('coin-count').innerText = currentUser.coins;
            
            const inv = document.getElementById('blooks-container');
            inv.innerHTML = '';
            currentUser.blooks.forEach(b => {
                inv.innerHTML += `<div class="item-card"><div style="font-size:40px;">📦</div>${b}</div>`;
            });
        }

        function setView(id) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderPacks() {
            const container = document.getElementById('packs-container');
            container.innerHTML = '';
            for (let name in PACKS) {
                container.innerHTML += `
                    <div class="item-card" style="background:#fffae6; width:180px;">
                        <h3>${name} Pack</h3>
                        <p style="color:#00cc66; margin:5px 0;">🪙 ${PACKS[name].cost} Coins</p>
                        <button class="btn-play" style="font-size:12px;" onclick="openPack('${name}')">Buy & Open</button>
                    </div>`;
            }
        }

        function openPack(name) {
            const pack = PACKS[name];
            if (currentUser.coins < pack.cost) return alert('Not enough coins!');
            
            currentUser.coins -= pack.cost;
            const rewardBlook = pack.blooks[Math.floor(Math.random() * pack.blooks.length)];
            currentUser.blooks.push(rewardBlook);
            
            saveGame();
            updateUI();
            alert(`🎉 You pulled: ${rewardBlook}!`);
        }
        
        function spinWheel() {
            const now = Date.now();
            if (now - currentUser.lastWheel < 3600000) {
                const remaining = Math.ceil((3600000 - (now - currentUser.lastWheel)) / 60000);
                return alert(`Wait ${remaining} minutes before spinning again!`);
            }
            const reward = Math.floor(Math.random() * 100) + 20;
            currentUser.coins += reward;
            currentUser.lastWheel = now;
            saveGame();
            updateUI();
            alert(`💰 Boom! You spun and won ${reward} coins!`);
        }

        function sendChat() {
            const inp = document.getElementById('chat-msg');
            if (!inp.value) return;
            addChatMessage(currentUser.username + (currentUser.isAdmin ? ' [👑 OWNER]' : ''), inp.value);
            inp.value = '';
        }

        function addChatMessage(user, text) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${user}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function startChatBot() {
            setInterval(() => {
                const randomUser = "Player" + Math.floor(Math.random() * 900 + 100);
                const randomText = botMessages[Math.floor(Math.random() * botMessages.length)];
                addChatMessage(randomUser, randomText);
            }, 7000);
        }

        function runAdmin() {
            const blookName = document.getElementById('adm-blook').value;
            const coinAmt = document.getElementById('adm-coins').value;
            
            if (blookName) currentUser.blooks.push(blookName);
            if (coinAmt) currentUser.coins += parseInt(coinAmt);
            
            saveGame();
            updateUI();
            alert("Admin assets injected!");
        }
    </script>
</body>
</html>
